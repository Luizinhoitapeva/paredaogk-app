<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Outline -->
  <path d="M 256 60 L 410 120 C 410 270 345 370 256 440 C 167 370 102 270 102 120 Z" 
        fill="#0b1329" 
        stroke="url(#neonGrad)" 
        stroke-width="10" 
        filter="url(#glow)"/>

  <!-- Goal Crossbar & Net Lines -->
  <path d="M 160 170 L 352 170 L 352 290" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6,6"/>
  <path d="M 160 170 L 160 290" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6,6"/>
  <line x1="208" y1="170" x2="208" y2="290" stroke="#1e293b" stroke-width="2"/>
  <line x1="256" y1="170" x2="256" y2="290" stroke="#1e293b" stroke-width="2"/>
  <line x1="304" y1="170" x2="304" y2="290" stroke="#1e293b" stroke-width="2"/>

  <!-- Goalkeeper Gloves / Catching Wall Icon -->
  <!-- Left Glove Hand -->
  <path d="M 195 240 C 175 220 180 190 205 180 C 215 175 230 185 235 200 L 240 230 C 235 255 205 260 195 240 Z" fill="#22c55e"/>
  <!-- Right Glove Hand -->
  <path d="M 317 240 C 337 220 332 190 307 180 C 297 175 282 185 277 200 L 272 230 C 277 255 307 260 317 240 Z" fill="#38bdf8"/>

  <!-- Central Soccer Ball in Firm Grip -->
  <circle cx="256" cy="225" r="42" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
  <!-- Ball Pentagons -->
  <polygon points="256,205 270,215 265,232 247,232 242,215" fill="#020617"/>
  <line x1="256" y1="205" x2="256" y2="188" stroke="#020617" stroke-width="3"/>
  <line x1="270" y1="215" x2="286" y2="218" stroke="#020617" stroke-width="3"/>
  <line x1="265" y1="232" x2="274" y2="246" stroke="#020617" stroke-width="3"/>
  <line x1="247" y1="232" x2="238" y2="246" stroke="#020617" stroke-width="3"/>
  <line x1="242" y1="215" x2="226" y2="218" stroke="#020617" stroke-width="3"/>

  <!-- Dynamic PAREDÃO GK Wordmark -->
  <text x="256" y="340" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" 
        font-weight="900" 
        fill="#f8fafc" 
        text-anchor="middle" 
        letter-spacing="2">
    PAREDÃO
  </text>
  
  <rect x="215" y="356" width="82" height="28" rx="6" fill="url(#neonGrad)"/>
  <text x="256" y="377" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="900" 
        fill="#020617" 
        text-anchor="middle" 
        letter-spacing="1.5">
    GK
  </text>

  <!-- ArenaDraft partner badge -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="600" 
        fill="#64748b" 
        text-anchor="middle" 
        letter-spacing="1">
    POWERED BY ARENADRAFT
  </text>
</svg>
